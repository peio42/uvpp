name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: ${{ matrix.compiler.name }}

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cxx: g++
            id: gcc
          - name: Clang
            cxx: clang++
            id: clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang libgtest-dev libuv1-dev

      - name: Build and run tests
        run: make clean test CXX=${{ matrix.compiler.cxx }} CXX_ID=${{ matrix.compiler.id }}

  asan-ubsan:
    runs-on: ubuntu-latest
    name: ASan / UBSan

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgtest-dev libuv1-dev

      - name: Build and run sanitizer tests
        run: make clean test-asan-ubsan
