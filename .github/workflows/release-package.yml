name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, for example 2.0.0 or 2.0.0-rc.1
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    name: Validate and release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang libgtest-dev libuv1-dev

      - name: Validate version
        env:
          UVPP_VERSION: ${{ inputs.version }}
        run: |
          version="$UVPP_VERSION"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $version"
            echo "Expected semver-like value, example: 2.0.0 or 2.0.0-rc.1"
            exit 1
          fi

      - name: Run validation tests
        run: make clean test-all

      - name: Build package
        env:
          UVPP_VERSION: ${{ inputs.version }}
        run: make package VERSION="$UVPP_VERSION"

      - name: Create release tag
        env:
          UVPP_VERSION: ${{ inputs.version }}
        run: |
          tag="v$UVPP_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "uvpp $UVPP_VERSION"
          git push origin "refs/tags/$tag"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: uvpp ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/uvpp-${{ inputs.version }}.tar.gz
            dist/SHA256SUMS
